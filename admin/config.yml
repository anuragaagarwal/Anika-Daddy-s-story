backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "images"

site_url: https://anikagarwal.com

collections:
  - name: "months"
    label: "Monthly Chapters"
    folder: "content/months"
    create: false
    delete: false
    identifier_field: "title"
    format: "json"
    slug: "{{fields.id}}"
    summary: "{{title}} — {{eyebrow}}"
    fields:
      - { label: "Month ID (do not change)", name: "id", widget: "string" }
      - { label: "Age / Eyebrow label", name: "eyebrow", widget: "string" }
      - { label: "Chapter Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - label: "To Anika — closing note"
        name: "note"
        widget: "text"
        hint: "You can use <br><br> for paragraph breaks."
      - label: "Personal Journal — your private reflections"
        name: "journal"
        widget: "text"
        required: false
        hint: "Your own thoughts about this time, separate from the note to Anika. You can use <br><br> or <p></p> for paragraph breaks."
      - label: "Photos"
        name: "photos"
        widget: "list"
        allow_add: true
        summary: "{{fields.caption}}"
        fields:
          - { label: "Photo", name: "src", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string" }

  - name: "letters"
    label: "Letters I Couldn't Say"
    files:
      - name: "letters"
        label: "Letters"
        file: "content/letters/letters.json"
        fields:
          - label: "Letters"
            name: "letters"
            widget: "list"
            allow_add: true
            summary: "{{fields.date}} — {{fields.text}}"
            fields:
              - { label: "Date (optional, e.g. March 2024)", name: "date", widget: "string", required: false }
              - { label: "Letter text", name: "text", widget: "text" }
